<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Compatibility — Sanguine</title>
<meta name="description" content="Which blood groups can donate to and receive from each other.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2C12 2 5 11.5 5 15.5C5 19.64 8.13 22 12 22C15.87 22 19 19.64 19 15.5C19 11.5 12 2 12 2Z' fill='%23D90429'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="site-header"></div>
<main id="main" tabindex="-1">
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">Blood Compatibility</span>
      <h1>Who can donate to whom</h1>
      <p class="lead" style="max-width:60ch">Click any blood group to highlight its donation and recipient matches.</p>
    </div>
  </section>
  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="compat-table-wrap">
        <table class="compat">
          <thead><tr><th>Blood group</th><th>Can donate to</th><th>Can receive from</th></tr></thead>
          <tbody id="compatBody"></tbody>
        </table>
      </div>
      <div class="grid grid-2 mt-lg" id="compatDetail" hidden>
        <div class="card"><h3 id="donateToTitle"></h3><div class="flex gap-sm" style="flex-wrap:wrap" id="donateToList"></div></div>
        <div class="card"><h3 id="receiveFromTitle"></h3><div class="flex gap-sm" style="flex-wrap:wrap" id="receiveFromList"></div></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script type="module" src="js/pages/compatibility.js"></script>
</body>
</html>
